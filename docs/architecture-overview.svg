<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 884" width="760" height="884" font-family="Helvetica, Arial, sans-serif"><rect width="760" height="884" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#80868b"/></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1f1f1f">One store and one gateway serve every product on the same payment rails</text><text x="24" y="50" font-size="11.5" fill="#5f6368">External data only. Solid = built on staging, dashed = planned.</text><rect x="24" y="68" width="108" height="56" rx="8" fill="none" stroke="#80868b" stroke-width="1.25"/><text x="36" y="92" font-size="13" font-weight="600" fill="#1f1f1f">NESO</text><text x="36" y="108" font-size="11.5" fill="#5f6368">grid data</text><path d="M78 124V166" fill="none" stroke="#80868b" stroke-width="1.25" marker-end="url(#a)"/><rect x="145" y="68" width="108" height="56" rx="8" fill="none" stroke="#80868b" stroke-width="1.25" stroke-dasharray="5 4"/><text x="157" y="92" font-size="13" font-weight="600" fill="#1f1f1f">Elexon</text><text x="157" y="108" font-size="11.5" fill="#5f6368">prices</text><path d="M199 124V166" fill="none" stroke="#80868b" stroke-width="1.25" marker-end="url(#a)"/><rect x="266" y="68" width="108" height="56" rx="8" fill="none" stroke="#80868b" stroke-width="1.25" stroke-dasharray="5 4"/><text x="278" y="92" font-size="13" font-weight="600" fill="#1f1f1f">Env. Agency</text><text x="278" y="108" font-size="11.5" fill="#5f6368">flood, rivers</text><path d="M320 124V166" fill="none" stroke="#80868b" stroke-width="1.25" marker-end="url(#a)"/><rect x="386" y="68" width="108" height="56" rx="8" fill="none" stroke="#80868b" stroke-width="1.25" stroke-dasharray="5 4"/><text x="398" y="92" font-size="13" font-weight="600" fill="#1f1f1f">ECMWF</text><text x="398" y="108" font-size="11.5" fill="#5f6368">weather</text><path d="M440 124V166" fill="none" stroke="#80868b" stroke-width="1.25" marker-end="url(#a)"/><rect x="507" y="68" width="108" height="56" rx="8" fill="none" stroke="#80868b" stroke-width="1.25" stroke-dasharray="5 4"/><text x="519" y="92" font-size="13" font-weight="600" fill="#1f1f1f">EA / DESNZ</text><text x="519" y="108" font-size="11.5" fill="#5f6368">water, heat</text><path d="M561 124V166" fill="none" stroke="#80868b" stroke-width="1.25" marker-end="url(#a)"/><rect x="628" y="68" width="108" height="56" rx="8" fill="none" stroke="#80868b" stroke-width="1.25"/><text x="640" y="92" font-size="13" font-weight="600" fill="#1f1f1f">AISStream</text><text x="640" y="108" font-size="11.5" fill="#5f6368">vessels</text><path d="M682 124V166" fill="none" stroke="#80868b" stroke-width="1.25" marker-end="url(#a)"/><rect x="24" y="166" width="470" height="72" rx="8" fill="none" stroke="#80868b" stroke-width="1.25"/><text x="36" y="190" font-size="13" font-weight="600" fill="#1f1f1f">ingest-env</text><text x="36" y="206" font-size="11.5" fill="#5f6368">built: every NESO version kept, 6 datasets</text><text x="36" y="222" font-size="11.5" fill="#5f6368">planned: + prices, flood warnings, weather</text><rect x="507" y="166" width="108" height="72" rx="8" fill="none" stroke="#80868b" stroke-width="1.25" stroke-dasharray="5 4"/><text x="519" y="190" font-size="13" font-weight="600" fill="#1f1f1f">site loader</text><text x="519" y="206" font-size="11.5" fill="#5f6368">static maps</text><text x="519" y="222" font-size="11.5" fill="#5f6368">per site</text><rect x="628" y="166" width="108" height="72" rx="8" fill="none" stroke="#80868b" stroke-width="1.25"/><text x="640" y="190" font-size="13" font-weight="600" fill="#1f1f1f">ingest</text><text x="640" y="206" font-size="11.5" fill="#5f6368">AIS feed</text><text x="640" y="222" font-size="11.5" fill="#5f6368">+ NATS live</text><path d="M259 238V280" fill="none" stroke="#80868b" stroke-width="1.25" marker-end="url(#a)"/><path d="M561 238V280" fill="none" stroke="#80868b" stroke-width="1.25" marker-end="url(#a)"/><path d="M682 238V280" fill="none" stroke="#80868b" stroke-width="1.25" marker-end="url(#a)"/><rect x="24" y="280" width="712" height="88" rx="8" fill="none" stroke="#80868b" stroke-width="1.25"/><text x="36" y="304" font-size="13" font-weight="600" fill="#1f1f1f">Postgres</text><text x="36" y="320" font-size="11.5" fill="#5f6368">env_observation: append-only version store, point-in-time reads (the moat)</text><text x="36" y="336" font-size="11.5" fill="#5f6368">x402_payments, ledger_journal (hash-chained), credits, sessions</text><text x="36" y="352" font-size="11.5" fill="#5f6368">site_profile (planned): per-site static risk</text><path d="M300 368V410" fill="none" stroke="#80868b" stroke-width="1.25" marker-end="url(#a)" marker-start="url(#a)"/><text x="312" y="394" font-size="11.5" fill="#5f6368">notify and reads; payments and ledger writes</text><rect x="24" y="410" width="560" height="300" rx="8" fill="#f1f3f4" stroke="#80868b" stroke-width="1.25"/><text x="36" y="434" font-size="13" font-weight="600" fill="#1f1f1f">Gateway (the only public service)</text><rect x="40" y="446" width="528" height="104" rx="8" fill="#0b57d0" fill-opacity="0.12" stroke="#0b57d0" stroke-width="2"/><text x="52" y="470" font-size="13" font-weight="600" fill="#1f1f1f">Kernel</text><text x="52" y="486" font-size="11.5" fill="#1f1f1f">Catalog: one source for the API, OpenAPI, catalog, docs and home page</text><text x="52" y="502" font-size="11.5" fill="#1f1f1f">Billing: x402 per call, GBP credits, sessions (memory reads, SSE push)</text><text x="52" y="518" font-size="11.5" fill="#1f1f1f">Rules: I1 no charge if stale, I14 paid = delivered, I15 armed on success</text><text x="52" y="534" font-size="11.5" fill="#1f1f1f">Trust: sanctions, ERC-8004 tiers; settlement worker hands payments on</text><rect x="40" y="566" width="256" height="56" rx="8" fill="none" stroke="#80868b" stroke-width="1.25"/><text x="52" y="590" font-size="13" font-weight="600" fill="#1f1f1f">Maritime</text><text x="52" y="606" font-size="11.5" fill="#5f6368">vessels, density, queues, anomalies</text><rect x="312" y="566" width="256" height="56" rx="8" fill="none" stroke="#80868b" stroke-width="1.25"/><text x="324" y="590" font-size="13" font-weight="600" fill="#1f1f1f">Grid carbon</text><text x="324" y="606" font-size="11.5" fill="#5f6368">carbon signals, history, live stream</text><rect x="40" y="638" width="256" height="56" rx="8" fill="none" stroke="#80868b" stroke-width="1.25" stroke-dasharray="5 4"/><text x="52" y="662" font-size="13" font-weight="600" fill="#1f1f1f">Trading feed</text><text x="52" y="678" font-size="11.5" fill="#5f6368">NESO series + prices, as_of, stream</text><rect x="312" y="638" width="256" height="56" rx="8" fill="none" stroke="#80868b" stroke-width="1.25" stroke-dasharray="5 4"/><text x="324" y="662" font-size="13" font-weight="600" fill="#1f1f1f">Site intelligence</text><text x="324" y="678" font-size="11.5" fill="#5f6368">site carbon, cooling, flood, water</text><rect x="600" y="470" width="136" height="56" rx="8" fill="none" stroke="#80868b" stroke-width="1.25"/><text x="612" y="494" font-size="13" font-weight="600" fill="#1f1f1f">Facilitators</text><text x="612" y="510" font-size="11.5" fill="#5f6368">x402.org + ours</text><rect x="600" y="560" width="136" height="56" rx="8" fill="none" stroke="#80868b" stroke-width="1.25"/><text x="612" y="584" font-size="13" font-weight="600" fill="#1f1f1f">Base</text><text x="612" y="600" font-size="11.5" fill="#5f6368">USDC settles</text><rect x="600" y="632" width="136" height="88" rx="8" fill="none" stroke="#80868b" stroke-width="1.25"/><text x="612" y="656" font-size="13" font-weight="600" fill="#1f1f1f">Side services</text><text x="612" y="672" font-size="11.5" fill="#5f6368">reconciler</text><text x="612" y="688" font-size="11.5" fill="#5f6368">gas-keeper</text><text x="612" y="704" font-size="11.5" fill="#5f6368">Stripe top-ups</text><path d="M568 498H600" fill="none" stroke="#80868b" stroke-width="1.25" marker-end="url(#a)"/><path d="M668 526V560" fill="none" stroke="#80868b" stroke-width="1.25" marker-end="url(#a)"/><rect x="24" y="752" width="176" height="72" rx="8" fill="none" stroke="#80868b" stroke-width="1.25"/><text x="36" y="776" font-size="13" font-weight="600" fill="#1f1f1f">AI agents</text><text x="36" y="792" font-size="11.5" fill="#5f6368">x402 per call</text><text x="36" y="808" font-size="11.5" fill="#5f6368">MCP server on their side</text><rect x="216" y="752" width="176" height="72" rx="8" fill="none" stroke="#80868b" stroke-width="1.25"/><text x="228" y="776" font-size="13" font-weight="600" fill="#1f1f1f">Trading firms</text><text x="228" y="792" font-size="11.5" fill="#5f6368">sessions, SSE push</text><text x="228" y="808" font-size="11.5" fill="#5f6368">as_of history, Parquet</text><rect x="408" y="752" width="176" height="72" rx="8" fill="none" stroke="#80868b" stroke-width="1.25" stroke-dasharray="5 4"/><text x="420" y="776" font-size="13" font-weight="600" fill="#1f1f1f">Data centres</text><text x="420" y="792" font-size="11.5" fill="#5f6368">credits or subscription</text><text x="420" y="808" font-size="11.5" fill="#5f6368">site reports, alerts</text><path d="M112 752V710" fill="none" stroke="#80868b" stroke-width="1.25" marker-end="url(#a)"/><path d="M304 752V710" fill="none" stroke="#80868b" stroke-width="1.25" marker-end="url(#a)"/><path d="M496 752V710" fill="none" stroke="#80868b" stroke-width="1.25" marker-end="url(#a)"/><rect x="24" y="848" width="28" height="14" rx="8" fill="none" stroke="#80868b" stroke-width="1.25"/><text x="60" y="859" font-size="11.5" fill="#5f6368">built (on staging)</text><rect x="200" y="848" width="28" height="14" rx="8" fill="none" stroke="#80868b" stroke-width="1.25" stroke-dasharray="5 4"/><text x="236" y="859" font-size="11.5" fill="#5f6368">planned</text></svg>