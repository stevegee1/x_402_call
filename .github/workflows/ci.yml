name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Hot-path latency budgets, alone so other tests don't compete for the CPU (architecture.md §6.4).
      - run: pnpm test:latency

  integration:
    # Real Postgres 16 via Testcontainers (Docker is available on ubuntu-latest runners).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A real NATS server for the AIS bus test (pinned release, checksum from the release's SHA256SUMS).
      - name: Install nats-server
        run: |
          v=2.10.29
          curl -sSLo /tmp/nats.tgz "https://github.com/nats-io/nats-server/releases/download/v$v/nats-server-v$v-linux-amd64.tar.gz"
          echo "e314da74a83a1d3876db8814c27eb990fe729640fd6452025b441bcede8390da  /tmp/nats.tgz" | sha256sum -c -
          tar -xzf /tmp/nats.tgz -C /tmp
          echo "NATS_SERVER_BIN=/tmp/nats-server-v$v-linux-amd64/nats-server" >> "$GITHUB_ENV"
      - run: pnpm test:integration

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.5
      - run: forge fmt --check
        working-directory: contracts
      - run: forge test -vv
        working-directory: contracts

  e2e:
    # anvil + MockUSDC (EIP-3009) + self-hosted facilitator + four gateway replicas on Postgres 16.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: e2e/.logs/
